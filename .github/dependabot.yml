version: 2

updates:
  # Dépendances Node.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Images et dépendances Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"